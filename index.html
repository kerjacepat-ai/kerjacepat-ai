
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KerjaCepat AI - Asisten Pintar</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#f8fafc}
header{padding:20px;background:#111a30;border-bottom:1px solid #26334d}
header h2{margin:0;color:#60a5fa}
header p{margin:6px 0 0;color:#9ca3af;font-size:13px}
main{max-width:750px;margin:auto;padding:20px}
.welcome{text-align:center;margin:35px 0}
.welcome h1{font-size:28px}
.welcome p{color:#9ca3af}
.prompts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:25px 0}
.prompts button{background:#17233c;color:white;border:1px solid #33415e;padding:14px;border-radius:12px;text-align:left}
#chat{display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
.msg{padding:14px 16px;border-radius:15px;max-width:90%;line-height:1.5;white-space:pre-wrap}
.user{align-self:flex-end;background:#2563eb}
.bot{align-self:flex-start;background:#19243a;border:1px solid #33415e}
.input-area{position:sticky;bottom:0;background:#0b1020;padding:12px 0;display:flex;gap:8px}
textarea{flex:1;resize:none;background:#17233c;color:white;border:1px solid #33415e;border-radius:12px;padding:14px;font-size:15px;min-height:52px}
button{cursor:pointer}
.send{background:#2563eb;color:white;border:0;border-radius:12px;padding:0 20px;font-weight:bold}
.note{font-size:11px;color:#64748b;text-align:center;margin-top:12px}
@media(max-width:450px){.prompts{grid-template-columns:1fr}.welcome h1{font-size:24px}}
</style>
</head>
<body>
<header>
<h2>⚡ KerjaCepat AI</h2>
<p>Asisten pintar untuk pekerjaan sehari-hari</p>
</header>
<main>
<div class="welcome" id="welcome">
<h1>Ada yang bisa saya bantu?</h1>
<p>Tulis kebutuhanmu dan mulai bekerja lebih cepat.</p>
</div>
<div class="prompts" id="prompts">
<button onclick="quick('Buatkan pesan izin tidak masuk kerja')">✉️ Pesan kerja</button>
<button onclick="quick('Bantu saya merangkum sebuah teks')">📝 Ringkas teks</button>
<button onclick="quick('Buatkan daftar kegiatan harian')">✅ To-do list</button>
<button onclick="quick('Perbaiki tulisan saya agar lebih profesional')">✨ Perbaiki tulisan</button>
</div>
<div id="chat"></div>
<div class="input-area">
<textarea id="input" placeholder="Tulis pesan di sini..." rows="1"></textarea>
<button class="send" onclick="send()">Kirim</button>
</div>
<div class="note">KerjaCepat AI · Versi demo</div>
</main>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('input');
function add(text,type){
const div=document.createElement('div');
div.className='msg '+type;
div.textContent=text;
chat.appendChild(div);
window.scrollTo(0,document.body.scrollHeight);
}
function quick(text){input.value=text;send();}
function send(){
const text=input.value.trim();
if(!text)return;
document.getElementById('welcome').style.display='none';
document.getElementById('prompts').style.display='none';
add(text,'user');
input.value='';
setTimeout(()=>{
let answer;
const t=text.toLowerCase();
if(t.includes('izin')||t.includes('kerja')){
answer='Berikut contoh pesan izin kerja:\n\nSelamat pagi, Pak/Bu. Mohon izin, hari ini saya belum dapat masuk kerja karena ada keperluan keluarga yang perlu saya tangani. Mohon pengertiannya. Terima kasih.';
}else if(t.includes('ringkas')||t.includes('rangkuman')){
answer='Silakan kirim teks yang ingin diringkas. Saya akan bantu menyusunnya menjadi poin-poin penting.';
}else if(t.includes('todo')||t.includes('kegiatan')||t.includes('daftar')){
answer='Contoh daftar kegiatan harian:\n\n1. Periksa pekerjaan utama.\n2. Selesaikan tugas paling penting.\n3. Periksa pesan dan email.\n4. Evaluasi pekerjaan.\n5. Siapkan rencana untuk besok.';
}else if(t.includes('perbaiki')||t.includes('profesional')){
answer='Silakan kirim tulisan yang ingin diperbaiki. Saya akan bantu membuatnya lebih rapi dan profesional.';
}else{
answer='Terima kasih sudah menggunakan KerjaCepat AI! Saat ini website masih dalam mode demo. Fitur AI sungguhan akan dihubungkan pada tahap berikutnya.';
}
add(answer,'bot');
},500);
}
input.addEventListener('keydown',e=>{
if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
</script>
</body>
</html>
